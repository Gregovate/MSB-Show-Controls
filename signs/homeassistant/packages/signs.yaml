  - condition: state
    entity_id: input_boolean.msb_signs_configured
    state: 'on'
  - condition: state
    entity_id: input_boolean.msb_signs_preshow_configured
    state: 'on'
  actions:
  - action: mqtt.publish
    data:
      topic: msb/signs/bridge/control
      qos: 1
      retain: true
      payload: "{# Executed by Home Assistant, using its configured America/Chicago timezone.\n   Public sign opening\
        \ date stays independent of the counter season reset date. #}\n{% set stamp = now() %}\n{% set day = stamp.date().isoformat()\
        \ %}\n{% set opening = states('input_datetime.msb_signs_public_start_date') %}\n{% set season_end = states('input_datetime.msb_show_end_date')\
        \ %}\n{% set down = states('input_datetime.msb_show_down_date') %}\n{% set start_text = states('input_datetime.msb_show_start_time')\
        \ %}\n{% set end_text = states('input_datetime.msb_show_end_time') %}\n{% set valid = start_text not in\
        \ ['unknown','unavailable',''] and end_text not in ['unknown','unavailable',''] and opening not in ['unknown','unavailable','']\
        \ and season_end not in ['unknown','unavailable',''] %}\n{% set ns = namespace(start=stamp, end=stamp, advertising=false)\
        \ %}\n{% set shared_end = as_datetime(states('sensor.msb_effective_entry_closing_time')) %}\n{% set shared_start\
        \ = as_datetime(state_attr('sensor.msb_effective_entry_closing_time','public_start')) %}\n{% set valid =\
        \ valid and shared_start is not none and shared_end is not none %}\n{% if valid %}{% set ns.start = shared_start\
        \ %}{% set ns.end = shared_end %}{% endif %}\n{% set operating_day = ns.start.date().isoformat() %}\n{%\
        \ set season = valid and opening <= operating_day <= season_end and operating_day != down %}\n{% set special\
        \ = valid and is_state('input_boolean.msb_signs_special_event_enabled','on') and operating_day == states('input_datetime.msb_signs_special_event_date')\
        \ %}\n{% set force_close = not is_state('input_boolean.msb_show_force_close','off') %}\n{% set gates = valid\
        \ and (season or special) and ns.start <= stamp < ns.end and not force_close %}\n{% for offset in [-1,0]\
        \ %}\n  {% for prefix in ['morning','evening'] %}\n    {% set a = states('input_datetime.msb_signs_' ~ prefix\
        \ ~ '_start') %}\n    {% set b = states('input_datetime.msb_signs_' ~ prefix ~ '_end') %}\n    {% if a not\
        \ in ['unknown','unavailable',''] and b not in ['unknown','unavailable',''] %}\n      {% set begin = today_at(a)\
        \ + timedelta(days=offset) %}\n      {% set finish = today_at(b) + timedelta(days=offset) %}\n      {% if\
        \ finish <= begin %}{% set finish = finish + timedelta(days=1) %}{% endif %}\n      {% if begin <= stamp\
        \ < finish %}{% set ns.advertising = true %}{% endif %}\n    {% endif %}\n  {% endfor %}\n{% endfor %}\n\
        {% set enabled = is_state('input_boolean.msb_signs_enabled','on') %}\n{% set weather = is_state('input_boolean.msb_signs_weather_closed','on')\
        \ %}\n{% set closed = is_state('input_select.msb_signs_admission_state','Closed') %}\n{% set clearing =\
        \ is_state('input_select.msb_signs_admission_state','Clearing queue') and valid and opening <= day <= season_end\
        \ and day != down %}\n{% set admitting = (gates or clearing) and not closed and not weather %}\n{% set preshow\
        \ = valid and day <= opening and not gates and not clearing and not closed and not weather %}\n{% set traffic\
        \ = states('sensor.msb_traffic_status') %}\n{% set counters_online = is_state('binary_sensor.msb_car_counter_online','on')\
        \ and is_state('binary_sensor.msb_gate_counter_online','on') %}\n{% set car_online = is_state('binary_sensor.msb_car_counter_online','on')\
        \ %}\n{% set tonight = states('sensor.msb_car_counter_enter_cars') %}\n{% set season_count = states('sensor.msb_car_counter_show_total_cars')\
        \ %}\n{% set food_entity = states('input_text.msb_signs_food_entity') %}\n{% set food = states(food_entity)\
        \ if food_entity.startswith('sensor.') else 'unknown' %}\n{# A queue-wait entity must measure Sign 2 ->\
        \ entry. Never substitute the\n   existing msb_travel_time_estimate_min (time WITHIN the park). #}\n{% set\
        \ wait_entity = 'sensor.msb_sign2_queue_wait_minutes' %}\n{% set wait = states(wait_entity) if wait_entity.startswith('sensor.')\
        \ else 'unknown' %}\n{% set expires = as_timestamp(states('input_datetime.msb_signs_promotion_expires'),\
        \ 0) %}\n{% set tomorrow = valid and (stamp.date() + timedelta(days=1)).isoformat() == opening %}\n{% set\
        \ opening_day = valid and day == opening %}\n{% set opening_time = ns.start.strftime('%I:%M %p').lstrip('0').replace(':00','')\
        \ if valid else 'Unavailable' %}\n{% set announce = ['OPEN TOMORROW', opening_time] if tomorrow else ['OPEN\
        \ TONIGHT',''] if opening_day else ['OPENS', as_datetime(opening).strftime('%b %d').upper()] if valid else\
        \ ['',''] %}\n{% set ha = {\n  'allowed': enabled and (weather or (not force_close and valid and (ns.advertising\
        \ or gates or clearing or closed))),\n  'weather_closed': weather, 'admissions_closed': closed, 'clearing_queue':\
        \ clearing,\n  'admitting': admitting, 'gates_open': gates, 'preshow': preshow, 'opening_day': opening_day,\n\
        \  'promotion': is_state('input_boolean.msb_signs_promotion_enabled','on') and stamp.timestamp() < expires,\n\
        \  'traffic_valid': counters_online and traffic in ['light','moderate','busy','very_busy'],\n  'traffic':\
        \ traffic.replace('_',' ').upper(), 'traffic_key': traffic,\n  'tonight': (tonight | int | string) if car_online\
        \ and is_number(tonight) and tonight | float >= 0 else none,\n  'season_total': (season_count | int | string)\
        \ if car_online and is_number(season_count) and season_count | float >= 0 else none,\n  'food_lbs': (food\
        \ | int | string) if is_number(food) and food | float >= 0 else none,\n  'wait_minutes': (wait | float |\
        \ round(0,'ceil') | int | string) if admitting and counters_online and is_number(wait) and wait | float\
        \ >= 0 and wait_entity != 'sensor.msb_travel_time_estimate_min' else none,\n  'wait_status': 'Missing HA\
        \ queue-wait source' if not wait_entity.startswith('sensor.') else 'Wrong source: in-park travel time' if\
        \ wait_entity == 'sensor.msb_travel_time_estimate_min' else 'Counter offline' if not counters_online else\
        \ 'HA queue wait unavailable' if not is_number(wait) or wait | float < 0 else 'HA queue wait ready',\n \
        \ 'closing_time': ns.end.strftime('%I:%M %p').lstrip('0') if valid else 'Unavailable',\n  'opening_time':\
        \ opening_time, 'opening_announcement': announce,\n  'in_park': states('sensor.msb_gate_counter_in_park_cars'),\
        \ 'show_total': season_count,\n  'schedule_status': 'Weather closure' if weather else 'Entry closed' if\
        \ closed else 'Clearing queue' if clearing else 'Force close — overlays suppressed' if force_close else\
        \ 'Public show' if gates else 'Advertising' if preshow and ns.advertising else 'Outside sign schedule'\n\
        } %}\n\n{% set message_list = namespace(messages=[]) %}\n{% for i in range(1,18) %}\n  {% set p = 'msb_signs_message_'\
        \ ~ i ~ '_' %}\n  {% set message_list.messages = message_list.messages + [{\n    'id': i, 'target': states('input_select.'\
        \ ~ p ~ 'target'),\n    'condition': states('input_select.' ~ p ~ 'condition'),\n    'color_mode': states('input_select.'\
        \ ~ p ~ 'color_mode'),\n    'line1': states('input_text.' ~ p ~ 'line1'), 'line2': states('input_text.'\
        \ ~ p ~ 'line2'),\n    'background': states('input_text.' ~ p ~ 'background'),\n    'text_color': states('input_text.'\
        \ ~ p ~ 'text_color'),\n    'order': states('input_number.' ~ p ~ 'order') | int(1),\n    'seconds': states('input_number.'\
        \ ~ p ~ 'seconds') | int(0)\n  }] %}\n{% endfor %}\n{{ {\n  'schema': 3, 'sent_at': now().timestamp(),\n\
        \  'enabled': is_state('input_boolean.msb_signs_enabled','on'),\n  'gate_message_enabled': is_state('input_boolean.msb_signs_gate_message_enabled','on'),\n\
        \  'screen_seconds': states('input_number.msb_signs_screen_seconds') | int(5),\n  'lor_seconds': {\n   \
        \ 'HWY 42': states('input_number.msb_signs_hwy42_lor_seconds') | int(30),\n    'Front Entrance': states('input_number.msb_signs_front_lor_seconds')\
        \ | int(30)\n  },\n  'ha': ha,\n  'colors': {\n    'open': states('input_text.msb_signs_color_open'),\n\
        \    'closed': states('input_text.msb_signs_color_closed'),\n    'light': states('input_text.msb_signs_color_light'),\n\
        \    'moderate': states('input_text.msb_signs_color_moderate'),\n    'busy': states('input_text.msb_signs_color_busy'),\n\
        \    'very_busy': states('input_text.msb_signs_color_very_busy')\n  },\n  'messages': message_list.messages\n\
        } | to_json }}"
mqtt:
  sensor:
  - name: HWY 42 Activity
    unique_id: msb_signs_hwy42
    default_entity_id: sensor.msb_signs_hwy42
    state_topic: msb/signs/bridge/state
    value_template: '{{ value_json.hwy42 }}'
    availability_topic: msb/signs/bridge/availability
    payload_available: online
    payload_not_available: offline
    expire_after: 35
  - name: Front Entrance Activity
    unique_id: msb_signs_front
    default_entity_id: sensor.msb_signs_front
    state_topic: msb/signs/bridge/state
    value_template: '{{ value_json.front }}'
    availability_topic: msb/signs/bridge/availability
    payload_available: online
    payload_not_available: offline
    expire_after: 35
  - name: Effective Gate Closing Time
    unique_id: msb_signs_closing_time
    default_entity_id: sensor.msb_signs_closing_time
    state_topic: msb/signs/bridge/state
    value_template: '{{ value_json.closing_time }}'
    availability_topic: msb/signs/bridge/availability
    payload_available: online
    payload_not_available: offline
    expire_after: 35
  - name: Sign Bridge Error
    unique_id: msb_signs_error
    default_entity_id: sensor.msb_signs_error
    state_topic: msb/signs/bridge/state
    value_template: '{{ value_json.error }}'
    availability_topic: msb/signs/bridge/availability
    payload_available: online
    payload_not_available: offline
    expire_after: 35
  - name: Sign Schedule
    unique_id: msb_signs_schedule
    default_entity_id: sensor.msb_signs_schedule
    state_topic: msb/signs/bridge/state
    value_template: '{{ value_json.schedule_status | default(''Waiting for bridge update'') }}'
    expire_after: 35
  - name: Sign Bridge Version
    unique_id: msb_signs_version
    default_entity_id: sensor.msb_signs_version
    state_topic: msb/signs/bridge/state
    value_template: '{{ value_json.version | default(''Older bridge'') }}'
    expire_after: 35
  - name: Sign 2 Wait Source
    unique_id: msb_signs_wait_status
    default_entity_id: sensor.msb_signs_wait_status
    state_topic: msb/signs/bridge/state
    value_template: '{{ value_json.wait_status | default(''Waiting for bridge update'') }}'
    expire_after: 35
  binary_sensor:
  - name: Sign Bridge Online
    unique_id: msb_signs_online
    default_entity_id: binary_sensor.msb_signs_online
    state_topic: msb/signs/bridge/availability
    payload_on: online
    payload_off: offline
    device_class: connectivity
  - name: Sign Controls Fresh
    unique_id: msb_signs_controls_fresh
    default_entity_id: binary_sensor.msb_signs_controls_fresh
    state_topic: msb/signs/bridge/state
    value_template: '{{ ''ON'' if value_json.controls_fresh else ''OFF'' }}'
    expire_after: 35
