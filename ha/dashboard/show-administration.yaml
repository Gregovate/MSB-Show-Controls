views:
  - path: default_view
    title: Home
    cards:
      - type: entities
        entities:
          - entity: person.greg
          - entity: device_tracker.rneerhof
      - type: entities
        entities:
          - binary_sensor.backups_stale
        title: Binary sensor
      - type: entities
        entities:
          - sensor.backup_state
        title: Sensor
      - type: entities
        entities:
          - entity: sensor.msb_car_counter_car_temp
          - entity: sensor.msb_gate_counter_gate_temp
          - entity: sensor.msb_car_counter_car_ttp
          - entity: sensor.msb_gate_counter_exit_ttp
      - type: entities
        entities:
          - entity: switch.broadcast_radio_switch
          - entity: switch.car_counter_arches
          - entity: switch.volunteer_marquee
          - entity: switch.projector_switch
          - entity: switch.enter_alarm_light
          - entity: switch.gate_alarm_light
          - entity: switch.security_west_light
          - entity: switch.vt_radio_chargers
          - entity: switch.command_center_radio_charger
        title: Switch
      - square: false
        type: grid
        columns: 1
        cards:
          - type: entities
            entities:
              - entity: input_datetime.production_radio_on
              - entity: input_datetime.production_radio_off
              - entity: input_datetime.production_projector_on
              - entity: input_datetime.production_projector_off
              - entity: input_datetime.production_projector_off_safety
        title: Show Schedule
  - type: sections
    title: Cameras
    path: cameras
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Live Traffic Cameras
            heading_style: title
          - type: grid
            columns: 3
            square: false
            grid_options:
              columns: full
            cards:
              - type: custom:webrtc-camera
                entity: camera.cam_hwy_42n_profile001_substream
                name: Highway 42 North
              - type: custom:webrtc-camera
                entity: camera.cam_hwy_42s_profile001_substream
                name: Highway 42 South
              - type: custom:webrtc-camera
                entity: camera.front_gate_media_profile2
                name: Front Gate
              - type: custom:webrtc-camera
                entity: camera.fc_carcounter_media_profile2
                name: Car Counter
              - type: custom:webrtc-camera
                entity: camera.food_collection_media_profile2
                name: Food Collection
              - type: custom:webrtc-camera
                entity: camera.stars_profile001_substream
                name: Traffic Stars
              - type: custom:webrtc-camera
                entity: camera.church_media_profile2
                name: Icicle Tunnel
              - type: custom:webrtc-camera
                entity: camera.northern_lights_media_profile2
                name: Northern Lights
              - type: custom:webrtc-camera
                entity: camera.candyland_media_profile2
                name: Candyland
              - type: custom:webrtc-camera
                entity: camera.polarbear_cam_media_profile2
                name: Polar Bear
              - type: custom:webrtc-camera
                entity: camera.igloo_colunteers_media_profile2
                name: Igloo Volunteers
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Volunteer Trailer - Security
            heading_style: title
          - type: grid
            columns: 3
            square: false
            grid_options:
              columns: full
            cards:
              - type: custom:webrtc-camera
                entity: camera.vt_parking_cam_media_profile2
                name: VT Parking
              - type: custom:webrtc-camera
                entity: camera.vt_office_profile100
                name: VT Office
              - type: custom:webrtc-camera
                entity: camera.vt_common_profile100
                name: VT Common Area
    cards: []
  - type: sections
    max_columns: 4
    title: Counts
    path: counts
    icon: mdi:car-multiple
    visibility:
      - user: person.greg
    sections:
      - type: grid
        cards:
          - type: heading
            icon: mdi:clock-time-five-outline
            heading: Show Time Setup
            heading_style: title
          - type: markdown
            content: Set Show Start and End Times.
          - type: entities
            entities:
              - entity: input_datetime.msb_show_end_date
                name: End Date
              - entity: input_datetime.msb_show_down_date
                name: Down Date
              - entity: input_datetime.msb_show_start_time
              - entity: input_datetime.msb_show_end_time
              - entity: input_number.show_end_extension_min
            title: Show Times
          - type: markdown
            content: >-
              Offsets are in minutes from these times and used to reset daily
              show counts and start recording traffic Enter counts.
          - type: entities
            entities:
              - entity: input_number.carcounter_start_offset_min
                name: Reset Enter Counts
              - entity: input_number.carcounter_end_offset_min
                name: Stop Recording
            title: Car Counter Time Offsets
          - type: markdown
            content: >-
              Offsets are in minutes from these times and used to reset daily
              show counts and start recording traffic Exit counts. If Stop
              Recording in 0 then don't stop counting exit counts untl Midnight.
          - type: entities
            entities:
              - entity: input_number.gatecounter_start_offset_min
                name: Reset Gate Counts
              - entity: input_number.gatecounter_end_offset_min
                name: Stop Recording
            title: Gate Counter Time Offsets
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Show Control
          - type: markdown
            content: >-
              Turns show off in case of Emergency. Will not allow any
              automations to start
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:button-card
                entity: input_boolean.msb_show_force_close
                name: Show Stop
                icon: mdi:stop
                show_state: true
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 14px
                    - padding: 12px
          - type: logbook
            title: Entrance Gate Activity
            hours_to_show: 24
            entities:
              - cover.traffic_ghost_controls_ghost_controls
          - type: heading
            heading_style: title
            heading: Production Elements
          - type: markdown
            content: >-
              This is where you set the on/off times for all production elements
              needed to run the show outside of LOR Control.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                entity: input_datetime.production_radio_on
                name: Radio ON
                icon: mdi:radio
                show_state: true
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 14px
                    - padding: 12px
              - type: custom:button-card
                entity: input_datetime.production_radio_off
                name: Radio OFF
                icon: mdi:radio-off
                show_state: true
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 14px
                    - padding: 12px
              - type: custom:button-card
                entity: input_datetime.production_projector_on
                name: Laser ON
                icon: mdi:laser-pointer
                show_state: true
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 14px
                    - padding: 12px
                  name:
                    - font-weight: bold
              - type: custom:button-card
                entity: input_datetime.production_projector_off
                name: Laser OFF
                icon: mdi:laser-pointer-off
                show_state: true
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 14px
                    - padding: 12px
              - type: custom:button-card
                entity: input_datetime.production_projector_off_safety
                name: Laser Safety OFF
                icon: mdi:shield-alert
                show_state: true
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 14px
                    - padding: 12px
                    - background-color: rgba(255, 0, 0, 0.08)
      - type: grid
        columns: 1
        column_span: 1
        cards:
          - type: heading
            heading: Car Counter Reset Section
            heading_style: title
            icon: mdi:numeric
          - square: false
            type: grid
            columns: 1
            column_span: 1
            cards:
              - type: markdown
                content: >-
                  Allows resetting of car counter counts and firmware timer
                  variables for fine tuning.
              - type: entities
                title: Daily Car Reset
                show_header_toggle: false
                entities:
                  - entity: input_boolean.allow_enter_resets
                    name: Allow Enter Reset
                  - entity: input_number.update_enter_daily_total
                    name: Enter Daily Total
              - type: entities
                title: Enter Timer Variables
                show_header_toggle: false
                entities:
                  - entity: input_number.enter_stuck_timeout_s
                    name: Enter Stuck Timeout (s)
                  - entity: input_number.enter_cardetectms
                    name: Car Detect ms
          - type: heading
            heading: Gate Counter Reset Section
            heading_style: title
            icon: mdi:numeric
          - square: false
            type: grid
            cards:
              - type: markdown
                content: >-
                  Allows resetting of gate counter counts and firmware timer
                  variables for fine tuning.
              - type: entities
                title: Daily Gate Reset
                show_header_toggle: false
                entities:
                  - entity: input_boolean.allow_exit_resets
                    name: Allow Exit Reset
                  - entity: input_number.update_exit_daily_total
                    name: Exit Daily Total
              - type: entities
                title: Gate Timer Variables
                show_header_toggle: false
                entities:
                  - entity: input_number.gate_stuck_timeout_s
                    name: Gate Stuck Timer (s)
                  - entity: input_number.exit_cardetectms
                    name: Gate Car Detect ms
            columns: 1
            column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: Admin / Danger Zone
            heading_style: title
            icon: mdi:skull
          - type: markdown
            content: >-
              This is where the show calendar is setup. DO NOT CHANGE THE DATE
              AFTER THE SHOW STARTS!


              When the calendar is set, all counts are set to 0 for the start of
              the season.
          - type: entities
            title: Show Calendar Setup/Reset
            show_header_toggle: false
            entities:
              - entity: input_boolean.enable_calendar_resets
                name: Allow Calendar Reset
              - type: section
                label: Show Setup
              - entity: input_datetime.msb_show_start_date
                name: Show Start Date
              - type: section
                label: Overrides
              - entity: input_number.update_calendar_day
                name: Reset Calendar Day
              - entity: input_number.update_days_running
                name: Reset Days Running
              - entity: input_number.update_enter_show_total
                name: Reset Enter Show Total
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Device Health
            heading_style: title
          - type: entities
            title: Car Counter Firmware / Hello
            show_header_toggle: false
            entities:
              - entity: sensor.msb_car_counter_msb_car_counter_firmware
                name: Car Counter FW
              - entity: sensor.msb_car_counter_car_sd_status
                name: SD Status
              - entity: sensor.msb_car_counter_car_wifi_rssi
                name: Car Counter RSSI
              - entity: sensor.msb_car_counter_car_wifi_ip
                name: Car Counter IP
              - entity: sensor.msb_car_counter_car_wifi_ssid
                name: Car Counter SSID
              - entity: sensor.msb_car_counter_status
                name: Car Counter Hello
              - entity: sensor.msb_car_counter_car_counter_debug
              - entity: sensor.msb_car_counter_car_temp
                name: Enter Temp
              - entity: sensor.msb_car_counter_car_humidity
                name: Enter Humidity
          - type: entities
            title: Gate Counter Firmware / Hello
            show_header_toggle: false
            entities:
              - entity: sensor.msb_gate_counter_msb_gate_counter_firmware
                name: Gate Counter FW
              - entity: sensor.msb_gate_counter_gate_wifi_rssi
              - entity: sensor.msb_gate_counter_gate_wifi_ip
              - entity: sensor.msb_gate_counter_gate_wifi_ssid
              - entity: sensor.msb_gate_counter_gate_counter_debug
                name: Debug Log
              - entity: sensor.msb_gate_counter_gate_temp
                name: Exit Temp
              - entity: sensor.msb_gate_counter_gate_humidity
                name: Exit Humidity
              - entity: sensor.gatecounter_cardetectms_active
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Live Ops Snapshot
            heading_style: title
          - type: history-graph
            title: 6h Trends
            hours_to_show: 6
            refresh_interval: 30
            entities:
              - entity: sensor.msb_car_counter_enter_cars
              - entity: sensor.msb_gate_counter_exit_cars
              - entity: sensor.msb_gate_counter_in_park_cars
          - type: glance
            title: Current Counts
            columns: 3
            entities:
              - entity: sensor.msb_gate_counter_in_park_cars
                name: In Park
              - entity: sensor.msb_car_counter_enter_cars
                name: Enter Total
              - entity: sensor.msb_gate_counter_exit_cars
                name: Exit Total
          - type: glance
            title: Show Context
            columns: 3
            entities:
              - entity: sensor.msb_car_counter_days_running
                name: Days Running
              - entity: sensor.msb_car_counter_show_total_cars
                name: Show Total
              - entity: sensor.msb_car_counter_day_of_month
                name: Day of Month
    header:
      card:
        type: markdown
        text_only: true
        content: |-
          # Hello {{ user }}
          This is the show Administration ✨
