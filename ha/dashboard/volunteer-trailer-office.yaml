                    styles:
                      card:
                        - background-color: '#4caf50'
                      icon:
                        - color: white
                      name:
                        - color: white
      - type: grid
        square: false
        cards:
          - type: weather-forecast
            entity: weather.openweathermap
            show_current: true
            show_forecast: true
            forecast_type: daily
          - type: grid
            square: false
            columns: 4
            cards:
              - type: custom:button-card
                entity: sensor.openweathermap_wind_speed
                name: Sustained
                icon: mdi:weather-windy
                layout: vertical
                show_state: true
                styles:
                  card:
                    - padding: 10px
                    - border-radius: 16px
                  state:
                    - font-size: 20px
                    - font-weight: bold
                  name:
                    - font-size: 14px
                state:
                  - operator: '>'
                    value: 25
                    styles:
                      card:
                        - background-color: '#f44336'
                      state:
                        - color: white
                      name:
                        - color: white
                  - operator: '>'
                    value: 15
                    styles:
                      card:
                        - background-color: '#ff9800'
                      state:
                        - color: white
                      name:
                        - color: white
                  - operator: default
                    styles:
                      card:
                        - background-color: '#4caf50'
                      state:
                        - color: white
                      name:
                        - color: white
              - type: custom:button-card
                entity: sensor.openweathermap_wind_gust_speed
                name: Gust
                icon: mdi:weather-windy-variant
                layout: vertical
                show_state: true
                styles:
                  card:
                    - padding: 10px
                    - border-radius: 16px
                  state:
                    - font-size: 20px
                    - font-weight: bold
                  name:
                    - font-size: 14px
                state:
                  - operator: '>'
                    value: 35
                    styles:
                      card:
                        - background-color: '#f44336'
                      state:
                        - color: white
                      name:
                        - color: white
                  - operator: '>'
                    value: 25
                    styles:
                      card:
                        - background-color: '#ff9800'
                      state:
                        - color: white
                      name:
                        - color: white
                  - operator: default
                    styles:
                      card:
                        - background-color: '#4caf50'
                      state:
                        - color: white
                      name:
                        - color: white
              - type: custom:button-card
                entity: sensor.openweathermap_wind_direction
                name: Direction
                icon: mdi:compass
                layout: vertical
                show_state: true
                state_display: |
                  [[[
                    if (!entity || entity.state === undefined) return 'n/a';
                    const deg = parseFloat(entity.state);
                    if (isNaN(deg)) return entity.state;
                    const card = states['sensor.openweathermap_wind_direction_2']
                      ? states['sensor.openweathermap_wind_direction_2'].state
                      : '';
                    return card ? `${card} (${deg.toFixed(0)}°)` : `${deg.toFixed(0)}°`;
                  ]]]
                styles:
                  card:
                    - padding: 10px
                    - border-radius: 16px
                  state:
                    - font-size: 18px
                    - font-weight: bold
                  name:
                    - font-size: 14px
              - type: custom:button-card
                entity: sensor.openweathermap_wind_status
                name: Wind Status
                icon: mdi:alert-circle-outline
                layout: vertical
                show_state: true
                styles:
                  card:
                    - padding: 10px
                    - border-radius: 16px
                  state:
                    - font-size: 18px
                    - font-weight: bold
                  name:
                    - font-size: 14px
                state:
                  - value: Danger
                    styles:
                      card:
                        - background-color: '#f44336'
                      state:
                        - color: white
                      name:
                        - color: white
                  - value: Caution
                    styles:
                      card:
                        - background-color: '#ff9800'
                      state:
                        - color: white
                      name:
                        - color: white
                  - operator: default
                    styles:
                      card:
                        - background-color: '#4caf50'
                      state:
                        - color: white
                      name:
                        - color: white
    cards: []
    header:
      card:
        type: markdown
        text_only: true
        content: |
          # Making Spirits Bright 2026
