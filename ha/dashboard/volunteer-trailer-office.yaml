              {% set traffic = states('sensor.msb_traffic_status_snapshot') %}
              {% if has_value(entity) %}
                {{ states(entity, with_unit=true) }}{{ ' · ' ~ traffic.replace('_',' ').capitalize() if traffic in ['busy','very_busy'] else '' }}
              {% elif is_number(gate) %}
                Gate check: {{ gate }} cars · Show unavailable
              {% else %}
                Unavailable · No fresh Gate balance
              {% endif %}
            color: >-
              {% set traffic = states('sensor.msb_traffic_status_snapshot')
