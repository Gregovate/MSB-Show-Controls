views:
  - type: sections
    max_columns: 4
    title: ShowData
    path: show-control
    sections:
      - type: grid
        square: false
        cards:
          - type: heading
            heading: Highway 42 · North (left) / South (right)
            grid_options:
              columns: full
            heading_style: title
          - type: grid
            columns: 2
            square: false
            grid_options:
              columns: full
            cards:
              - type: custom:webrtc-camera
                entity: camera.cam_hwy_42n_profile001_substream
                name: Highway 42 North
              - type: custom:webrtc-camera
                entity: camera.cam_hwy_42s_profile001_substream
                name: Highway 42 South
          - type: custom:mushroom-template-card
            entity: cover.traffic_ghost_controls_ghost_controls
            primary: Entrance gate
            secondary: >-
              {{ states(entity) | capitalize if has_value(entity) else 'Unavailable' }}
            icon: "{{ 'mdi:gate-open' if is_state(entity, 'open') else 'mdi:gate' }}"
            color: >-
              {{ {'open':'green', 'closed':'red', 'opening':'amber', 'closing':'amber'}.get(states(entity), 'grey') }}
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
          - type: heading
            heading: Calendar
            heading_style: title
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:button-card
                entity: sensor.msb_car_counter_days_running
                name: Show Day
                icon: mdi:calendar
                layout: vertical
                show_state: true
                styles:
                  card:
                    - padding: 10px
                    - border-radius: 16px
                  state:
                    - font-size: 22px
                    - font-weight: bold
                  name:
                    - font-size: 14px
              - type: custom:button-card
                entity: sensor.msb_date_display
                name: Date
                show_icon: false
                layout: vertical
                show_state: true
                styles:
                  card:
                    - padding: 10px
                    - border-radius: 16px
                  state:
                    - font-size: 22px
                    - font-weight: bold
                  name:
                    - font-size: 14px
              - type: custom:button-card
                entity: sensor.msb_current_time_display
                name: Time
                icon: mdi:clock-outline
                layout: vertical
                show_state: true
                styles:
                  card:
                    - padding: 10px
                    - border-radius: 16px
                  state:
                    - font-size: 22px
                    - font-weight: bold
                  name:
                    - font-size: 14px
          - type: heading
            heading: Traffic Snapshot
            heading_style: title
          - type: grid
            square: false
            columns: 4
            cards:
              - type: custom:button-card
                entity: sensor.msb_enter_total_display
                name: Enter
                icon: mdi:car-arrow-right
                layout: vertical
                show_state: true
                show_units: false
                state_display: '[[[ return entity.attributes.formatted || entity.state ]]]'
                size: 30%
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 22px
                    - font-weight: bold
              - type: custom:button-card
                entity: sensor.msb_gate_counter_exit_cars
                name: Exit
                icon: mdi:car-arrow-left
                layout: vertical
                show_state: true
                show_units: false
                size: 30%
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 22px
                    - font-weight: bold
              - type: custom:button-card
                entity: sensor.msb_gate_counter_in_park_cars
                name: In Park
                icon: mdi:car-multiple
                layout: vertical
                show_state: true
                show_units: false
                size: 30%
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 22px
                    - font-weight: bold
              - type: custom:button-card
                entity: sensor.msb_show_total_display
                name: Show Total
                icon: mdi:counter
                layout: vertical
                show_state: true
                show_units: false
                state_display: '[[[ return entity.attributes.formatted || entity.state ]]]'
                size: 30%
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 22px
                    - font-weight: bold
          - type: heading
            heading: Traffic Control
            heading_style: title
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:button-card
                entity: sensor.msb_traffic_status_snapshot
                name: Status
                icon: mdi:traffic-light
                layout: vertical
                show_state: true
                show_units: false
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 20px
                    - font-weight: bold
                state:
                  - value: closed
                    styles:
                      card:
                        - background-color: '#b00020'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - value: light
                    styles:
                      card:
                        - background-color: '#2e7d32'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - value: moderate
                    styles:
                      card:
                        - background-color: '#fbc02d'
                      state:
                        - color: black
                      name:
                        - color: black
                      icon:
                        - color: black
                  - value: busy
                    styles:
                      card:
                        - background-color: '#fb8c00'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - value: very_busy
                    styles:
                      card:
                        - background-color: '#e53935'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
              - type: custom:button-card
                entity: sensor.msb_travel_time_estimate_min
                name: Travel Time
                icon: mdi:timer-sand
                layout: vertical
                show_state: true
                show_units: true
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 20px
                    - font-weight: bold
                state:
                  - value: unknown
                    operator: regex
                    styles:
                      card:
                        - background-color: '#9e9e9e'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - operator: <=
                    value: 24
                    styles:
                      card:
                        - background-color: '#2e7d32'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - operator: <=
                    value: 29
                    styles:
                      card:
                        - background-color: '#fbc02d'
                      state:
                        - color: black
                      name:
                        - color: black
                      icon:
                        - color: black
                  - operator: <=
                    value: 34
                    styles:
                      card:
                        - background-color: '#fb8c00'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - operator: '>='
                    value: 35
                    styles:
                      card:
                        - background-color: '#b00020'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
              - type: custom:button-card
                entity: sensor.msb_lane_2_advisory
                name: Lane 2
                icon: mdi:road-variant
                layout: vertical
                show_state: true
                show_units: false
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 18px
                    - font-weight: bold
                state:
                  - value: closed
                    styles:
                      card:
                        - background-color: '#9e9e9e'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - value: Close Lane 2
                    styles:
                      card:
                        - background-color: '#b00020'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - value: Lane 2 OK to Open
                    styles:
                      card:
                        - background-color: '#fbc02d'
                      state:
                        - color: black
                      name:
                        - color: black
                      icon:
                        - color: black
                  - value: Open Lane 2
                    styles:
                      card:
                        - background-color: '#2e7d32'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
              - type: custom:button-card
                entity: sensor.msb_merger_director_advisory
                name: Merge Control
                icon: mdi:account-hard-hat
                layout: vertical
                show_state: true
                show_units: false
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 18px
                    - font-weight: bold
                state:
                  - value: Merger Director Not Needed
                    styles:
                      card:
                        - background-color: '#2e7d32'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - value: closed
                    styles:
                      card:
                        - background-color: '#9e9e9e'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
              - type: custom:button-card
                entity: input_boolean.lane_2_open
                name: Lane 2 Actual
                icon: mdi:road
                layout: vertical
                show_state: true
                show_units: false
                tap_action:
                  action: toggle
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 18px
                    - font-weight: bold
                state:
                  - value: 'on'
                    name: Lane 2 OPEN
                    styles:
                      card:
                        - background-color: '#2e7d32'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - value: 'off'
                    name: Lane 2 CLOSED
                    styles:
                      card:
                        - background-color: '#9e9e9e'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
              - type: custom:button-card
                entity: input_boolean.merger_director_present
                name: Merger Actual
                icon: mdi:account-hard-hat
                layout: vertical
                show_state: true
                show_units: false
                tap_action:
                  action: toggle
                styles:
                  card:
                    - height: 100px
                    - padding: 8px
                    - border-radius: 14px
                  name:
                    - font-size: 12px
                  state:
                    - font-size: 18px
                    - font-weight: bold
                state:
                  - value: 'on'
                    name: Assigned
                    styles:
                      card:
                        - background-color: '#2e7d32'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
                  - value: 'off'
                    name: Not Assigned
                    styles:
                      card:
                        - background-color: '#9e9e9e'
                      state:
                        - color: white
                      name:
                        - color: white
                      icon:
                        - color: white
      - type: grid
        cards:
          - type: heading
            heading: Online Status
            heading_style: title
          - type: grid
            square: false
            columns: 2
            cards:
