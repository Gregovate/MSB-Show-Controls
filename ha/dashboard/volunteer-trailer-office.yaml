- title: Cash Entry
  path: cash-entry
  icon: mdi:cash-register
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
        - entity: sensor.msb_kiosk_counter_alert
          state_not: 'OK'
      card:
        type: custom:mushroom-template-card
        entity: sensor.msb_kiosk_counter_alert
        primary: Counter alert
        secondary: "{{ states(entity) if has_value(entity) else 'Counter monitoring unavailable' }}"
        multiline_secondary: true
        icon: mdi:alert
        color: red
        tap_action:
          action: none
    - type: markdown
      content: Cash entry will open here once the hourly collection form is published.
