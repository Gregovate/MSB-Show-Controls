# Existing supplied HA analytics; only window templates changed to share extension timing.
# The dedicated raw sensor preserves the firmware's literal unknown on its live topic.
mqtt:
  sensor:
  - name: MSB Gate Occupancy Raw
    unique_id: msb_gate_occupancy_raw
    state_topic: msb/traffic/GateCounter/Cars/InParkCars
    expire_after: 120
  - name: MSB Gate Occupancy Sample Time
    unique_id: msb_gate_occupancy_sample_time
    state_topic: msb/traffic/GateCounter/System/heartbeat
    expire_after: 120
    value_template: >-
      {{ value_json.now if value_json is defined and value_json is mapping
         and value_json.inpark is integer and value_json.now is string else 'unknown' }}
  - name: MSB Gate Occupancy Session
    unique_id: msb_gate_occupancy_session
    state_topic: msb/traffic/GateCounter/System/productionSession

sensor:
- platform: derivative
  name: MSB Enter Rate (cars/s)
  unique_id: msb_enter_rate_cars_s
  source: sensor.msb_car_counter_enter_cars
  unit_time: s
  round: 4
  time_window: 00:05:00
- platform: derivative
  name: MSB Exit Rate (cars/s)
  unique_id: msb_exit_rate_cars_s
  source: sensor.msb_gate_counter_exit_cars
  unit_time: s
  round: 4
  time_window: 00:05:00
template:
- binary_sensor:
  - default_entity_id: binary_sensor.msb_show_open
    unique_id: msb_show_open
    name: MSB Show Open (Published)
    state: '{% set start = as_datetime(state_attr(''sensor.msb_effective_entry_closing_time'',''public_start''))
      %}

      {% set end = as_datetime(states(''sensor.msb_effective_entry_closing_time'')) %}

      {% if start is none or end is none %}false

      {% else %}

      {{ is_state(''binary_sensor.msb_show_season'',''on'') and not is_state(''input_boolean.msb_show_force_close'',''on'')
      and start <= now() < end }}

      {% endif %}'
    icon: "{% if is_state('binary_sensor.msb_show_open', 'on') %}\n  mdi:string-lights\n{% else %}\n  mdi:string-lights-off\n\
      {% endif %}\n"
  - default_entity_id: binary_sensor.msb_carcounter_analytics_active
    unique_id: msb_carcounter_analytics_active
    name: MSB Car Counter Analytics Active
    state: '{% set start = as_datetime(state_attr(''sensor.msb_effective_entry_closing_time'',''public_start''))
      %}

      {% set end = as_datetime(states(''sensor.msb_effective_entry_closing_time'')) %}

      {% if start is none or end is none %}false

      {% else %}

      {% set tail = states(''input_number.msb_carcounter_analytics_cushion_minutes'') | int(15) %}

      {{ start <= now() < end + timedelta(minutes=tail) }}

      {% endif %}'
    icon: "{% if is_state('binary_sensor.msb_carcounter_analytics_active', 'on') %}\n  mdi:counter\n{% else %}\n\
      \  mdi:counter-off\n{% endif %}\n"
  - default_entity_id: binary_sensor.msb_gatecounter_analytics_active
    unique_id: msb_gatecounter_analytics_active
    name: MSB Gate Counter Analytics Active
    state: '{% set start = as_datetime(state_attr(''sensor.msb_effective_entry_closing_time'',''public_start''))
      %}

      {% set end = as_datetime(states(''sensor.msb_effective_entry_closing_time'')) %}

      {% if start is none or end is none %}false

      {% else %}

      {% set tail = states(''input_number.msb_carcounter_analytics_cushion_minutes'') | int(15) %}

      {% set start = start + timedelta(minutes=states(''input_number.msb_gatecounter_analytics_start_cushion_minutes'')
      | int(8)) %}

      {{ start <= now() < end + timedelta(minutes=tail) }}

      {% endif %}'
    icon: "{% if is_state('binary_sensor.msb_gatecounter_analytics_active', 'on') %}\n  mdi:car-multiple\n{% else\
      \ %}\n  mdi:car-off\n{% endif %}\n"
- sensor:
  - name: MSB Enter Rate (cars/min)
    unique_id: msb_enter_rate_cars_min
    icon: mdi:car-arrow-right
    unit_of_measurement: cars/min
    state_class: measurement
    state: "{% if not is_state('binary_sensor.msb_show_open', 'on') %}\n  0\n{% else %}\n  {% set v = states('sensor.msb_enter_rate_cars_s')\
      \ | float(0) %}\n  {% if v <= 0 %}\n    0\n  {% else %}\n    {{ (v * 60) | round(2) }}\n  {% endif %}\n{%\
      \ endif %}\n"
  - name: MSB Exit Rate (cars/min)
    unique_id: msb_exit_rate_cars_min
    icon: mdi:car-arrow-left
    unit_of_measurement: cars/min
    state_class: measurement
    state: "{% if not is_state('binary_sensor.msb_show_open', 'on') %}\n  0\n{% else %}\n  {% set v = states('sensor.msb_exit_rate_cars_s')\
      \ | float(0) %}\n  {% if v <= 0 %}\n    0\n  {% else %}\n    {{ (v * 60) | round(2) }}\n  {% endif %}\n{%\
      \ endif %}\n"
  - name: MSB Car Counter Time Between Cars (ms) - Valid
    unique_id: msb_car_counter_time_between_cars_ms_valid
    unit_of_measurement: ms
    icon: mdi:timer-outline
    state_class: measurement
    state: "{% if is_state('binary_sensor.msb_carcounter_analytics_active', 'on') %}\n  {{ states('sensor.msb_car_counter_time_between_cars_ms_valid')\
      \ | int(0) }}\n{% else %}\n  0\n{% endif %}\n"
  - name: MSB Flow Delta (cars/min)
    unique_id: msb_flow_delta_cars_min
    icon: mdi:swap-vertical
    unit_of_measurement: cars/min
    state_class: measurement
    state: "{% set active = is_state('binary_sensor.msb_gatecounter_analytics_active', 'on') %} {% if not active\
      \ %}\n  0\n{% else %}\n  {% set enter = states('sensor.msb_enter_rate_cars_min') | float(0) %}\n  {% set exit\
      \  = states('sensor.msb_exit_rate_cars_min') | float(0) %}\n  {{ (enter - exit) | round(2) }}\n{% endif %}\n"
  - name: MSB Flow Delta Smoothed (cars/min)
    unique_id: msb_flow_delta_smoothed_cars_min
    unit_of_measurement: cars/min
    state_class: measurement
    state: "{{ states('sensor.msb_flow_delta_cars_min') | float(0) }}\n    \n"
  - name: MSB In-Park Cars Band
    unique_id: msb_in_park_cars_band
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:account-group
    state: "{% set open = is_state('binary_sensor.msb_show_open', 'on') %} {% set cars = states('sensor.msb_in_park_cars_canonical')\
      \ | int(0) %} {% if not open %}\n  off_show\n{% elif cars < 80 %}\n  low\n{% elif cars < 120 %}\n  medium\n\
      {% elif cars < 150 %}\n  high\n{% else %}\n  very_high\n{% endif %}\n"
    attributes:
      in_park_cars: '{{ states(''sensor.msb_in_park_cars_canonical'') | int(none) }}'
  - name: MSB Travel Time Estimate (min)
    unique_id: msb_travel_time_estimate_min
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:timer-sand
    unit_of_measurement: min
    state_class: measurement
    state: "{% set open   = is_state('binary_sensor.msb_show_open','on') %} {% set active = is_state('binary_sensor.msb_gatecounter_analytics_active','on')\
      \ %} {% if not open or not active %}\n  unknown\n{% else %}\n  {% set inpark = states('sensor.msb_in_park_cars_canonical')\
      \ | int(0) %}\n  {% set exit   = states('sensor.msb_exit_rate_cars_min') | float(0) %}\n\n  {# LOW LOAD →\
      \ USE SIMPLE BAND (exit rate too noisy) #}\n  {% if inpark < 80 %}\n    15\n\n  {# NORMAL LOAD → USE FLOW\
      \ MATH #}\n  {% elif exit < 0.5 %}\n    45\n  {% else %}\n    {% set tt = (inpark / exit) %}\n    {{ [ [tt,\
      \ 15] | max, 60 ] | min | round(0) }}\n  {% endif %}\n{% endif %}\n"
  - name: MSB Travel Time Band
    unique_id: msb_travel_time_band
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:timer-sand-complete
    state: "{% if not is_state('binary_sensor.msb_show_open', 'on') %}\n  off_show\n{% else %}\n  {% set tt = states('sensor.msb_travel_time_estimate_min')\
      \ | float(0) %}\n  {# Bands aligned with 15 / 20 / 25 / 30 #}\n  {% if tt < 17 %}\n    light\n  {% elif tt\
      \ < 23 %}\n    moderate\n  {% elif tt < 28 %}\n    busy\n  {% else %}\n    very_busy\n  {% endif %}\n{% endif\
      \ %}\n"
    attributes:
      estimated_travel_minutes: "{% if is_state('binary_sensor.msb_show_open','on') %}\n  {{ states('sensor.msb_travel_time_estimate_min')\
        \ | int(0) }}\n{% else %}\n  unknown\n{% endif %}\n"
  - name: MSB Traffic Pressure
    unique_id: msb_traffic_pressure
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:gauge
    state: "{% set open = is_state('binary_sensor.msb_show_open', 'on') %} {% if not open %}\n  off_show\n{% else\
      \ %}\n  {% set cars  = states('sensor.msb_in_park_cars_canonical') | int(0) %}\n  {% set enter = states('sensor.msb_enter_rate_cars_min')\
      \ | float(0) %}\n  {% set exit  = states('sensor.msb_exit_rate_cars_min') | float(0) %}\n  {% set diff  =\
      \ enter - exit %}\n  {% if cars < 100 or diff <= 0 %}\n    low\n  {% elif cars >= 140 and diff > 0.2 %}\n\
      \    high\n  {% else %}\n    medium\n  {% endif %}\n{% endif %}\n"
    attributes:
      in_park_cars: '{{ states(''sensor.msb_in_park_cars_canonical'') | int(none) }}'
      enter_rate_cars_min: '{{ states(''sensor.msb_enter_rate_cars_min'') | float(0) }}'
      exit_rate_cars_min: '{{ states(''sensor.msb_exit_rate_cars_min'') | float(0) }}'
      flow_delta_cars_min: '{{ states(''sensor.msb_flow_delta_cars_min'') | float(0) }}'
      show_open: '{{ is_state(''binary_sensor.msb_show_open'', ''on'') }}'
      gatecounter_active: '{{ is_state(''binary_sensor.msb_gatecounter_analytics_active'', ''on'') }}'
      carcounter_active: '{{ is_state(''binary_sensor.msb_carcounter_analytics_active'', ''on'') }}'
  # Receiver-side measurement for equipment checks, available between shows.
  - name: MSB Gate Occupancy Diagnostic
    unique_id: msb_gate_occupancy_diagnostic
    unit_of_measurement: cars
    availability: >-
      {% set clock = now() %}
      {% set stamp = strptime(states('sensor.msb_gate_occupancy_sample_time'), '%Y-%m-%d %H:%M:%S', none) %}
      {% set online = states('binary_sensor.msb_gate_counter_gate_counter_online') %}
      {% if online == 'unknown' %}
        {% set online = states('binary_sensor.msb_gate_counter_online') %}
      {% endif %}
      {{ online == 'on' and stamp is not none
         and -5 <= clock.timestamp() - stamp.replace(tzinfo=clock.tzinfo).timestamp() <= 120
         and states('sensor.msb_gate_occupancy_raw') | regex_match('^-?[0-9]+$') }}
    state: "{{ states('sensor.msb_gate_occupancy_raw') | int(none) }}"
  - name: MSB In Park Cars (Canonical)
    unique_id: msb_in_park_cars_canonical
    availability: >-
      {% set clock = now() %}
      {% set stamp = strptime(states('sensor.msb_gate_occupancy_sample_time'), '%Y-%m-%d %H:%M:%S', none) %}
      {% set first = states('input_datetime.msb_signs_public_start_date') %}
      {% set last = states('input_datetime.msb_show_end_date') %}
      {% set down = states('input_datetime.msb_show_down_date') %}
      {% set opening = states('input_datetime.msb_show_start_time') %}
      {% set day = clock.strftime('%Y-%m-%d') %}
      {{ is_state('binary_sensor.msb_show_open','on') and stamp is not none and stamp.date() == clock.date()
         and is_number(states('sensor.msb_gate_occupancy_diagnostic'))
         and strptime(first, '%Y-%m-%d', none) is not none
         and strptime(last, '%Y-%m-%d', none) is not none
         and strptime(down, '%Y-%m-%d', none) is not none
         and first <= day <= last and day != down
         and strptime(opening, '%H:%M:%S', none) is not none
         and stamp.strftime('%H:%M:%S') >= opening and clock.strftime('%H:%M:%S') >= opening
         and states('sensor.msb_gate_occupancy_session') in ['READY','READY_FLASH_ONLY_CHECK_SESSION_CARD']
         }}
    icon: mdi:car-multiple
    state_class: measurement
    unit_of_measurement: cars
    state: '{{ states(''sensor.msb_gate_occupancy_diagnostic'') | int(none) }}

      '
  - name: MSB Traffic Status
    unique_id: msb_traffic_status
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:traffic-light
    state: "{% set open      = is_state('binary_sensor.msb_show_open', 'on') %} {% set pressure  = states('sensor.msb_traffic_pressure')\
      \ %} {% set tt_band   = states('sensor.msb_travel_time_band') %} {% set load_band = states('sensor.msb_in_park_cars_band')\
      \ %} {% set delta     = states('sensor.msb_flow_delta_cars_min') | float(0) %}\n{% if not open %}\n  closed\n\
      \n{# If we're clearly draining, don't over-alarm #} {% elif delta < -0.5 and load_band in ['low','medium']\
      \ %}\n  light\n\n{# Pressure dominates when building #} {% elif pressure == 'high' %}\n  very_busy\n{% elif\
      \ pressure == 'medium' %}\n  busy\n\n{# Fallback to load/travel bands #} {% elif tt_band in ['very_busy']\
      \ or load_band == 'very_high' %}\n  very_busy\n{% elif tt_band in ['busy'] or load_band == 'high' %}\n  busy\n\
      {% elif tt_band == 'moderate' %}\n  moderate\n{% else %}\n  light\n{% endif %}\n"
    attributes:
      travel_time_band: '{{ states(''sensor.msb_travel_time_band'') }}'
      in_park_band: '{{ states(''sensor.msb_in_park_cars_band'') }}'
      pressure: '{{ states(''sensor.msb_traffic_pressure'') }}'
      show_open: '{{ is_state(''binary_sensor.msb_show_open'', ''on'') }}'
      carcounter_active: '{{ is_state(''binary_sensor.msb_carcounter_analytics_active'', ''on'') }}'
      gatecounter_active: '{{ is_state(''binary_sensor.msb_gatecounter_analytics_active'', ''on'') }}'
  - name: MSB Flow Health
    unique_id: msb_flow_health
    availability: "{{ is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:swap-vertical
    state: "{% set cars  = states('sensor.msb_in_park_cars_canonical') | int(0) %} {% set delta = states('sensor.msb_flow_smoothed')\
      \ | float(0) %}\n{# Guardrail: low park load = don't alarm #} {% if cars < 80 %}\n  {% if delta <= 0 %}\n\
      \    draining\n  {% else %}\n    watch\n  {% endif %}\n\n{% else %}\n  {% if delta <= -0.5 %}\n    draining_fast\n\
      \  {% elif delta < 0 %}\n    draining\n  {% elif delta == 0 %}\n    balanced\n  {% elif delta <= 0.5 %}\n\
      \    building\n  {% elif delta <= 1.5 %}\n    building_fast\n  {% else %}\n    overloaded\n  {% endif %}\n\
      {% endif %}\n"
    attributes:
      in_park_cars: '{{ states(''sensor.msb_in_park_cars_canonical'') | int(none) }}'
      delta_cars_min: '{{ states(''sensor.msb_flow_delta_cars_min'') | float(0) }}'
      enter_cars_min: '{{ states(''sensor.msb_enter_rate_cars_min'') | float(0) }}'
      exit_cars_min: '{{ states(''sensor.msb_exit_rate_cars_min'') | float(0) }}'
  - name: MSB Traffic Status Reason
    unique_id: msb_traffic_status_reason
    availability: "{{ is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:comment-processing-outline
    state: "{% set open = is_state('binary_sensor.msb_show_open', 'on') %} {% set inpark = states('sensor.msb_in_park_cars_canonical')\
      \ | int(0) %} {% set enter = states('sensor.msb_enter_rate_cars_min') | float(0) %} {% set exit  = states('sensor.msb_exit_rate_cars_min')\
      \ | float(0) %} {% set delta = (enter - exit) | round(2) %} {% if not open %}\n  CLOSED | inpark={{inpark}}\
      \ enter={{enter}} exit={{exit}} delta={{delta}}\n{% else %}\n  OPEN | inpark={{inpark}} enter={{enter}} exit={{exit}}\
      \ delta={{delta}}\n{% endif %}\n"
  - name: MSB Traffic Status Snapshot
    unique_id: msb_traffic_status_snapshot
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:car-multiple
    state: '{{ states(''sensor.msb_traffic_status'') }}'
    attributes:
      status: '{{ states(''sensor.msb_traffic_status'') }}'
      show_open: '{{ is_state(''binary_sensor.msb_show_open'', ''on'') }}'
      carcounter_active: '{{ is_state(''binary_sensor.msb_carcounter_analytics_active'', ''on'') }}'
      gatecounter_active: '{{ is_state(''binary_sensor.msb_gatecounter_analytics_active'', ''on'') }}'
      estimated_travel_minutes: "{% if is_state('binary_sensor.msb_gatecounter_analytics_active','on') and\n   \
        \   is_state('binary_sensor.msb_show_open','on') %}\n  {{ states('sensor.msb_travel_time_estimate_min')\
        \ | int(0) }}\n{% else %}\n  null\n{% endif %}\n"
      in_park_cars: '{{ states(''sensor.msb_in_park_cars_canonical'') | int(none) }}'
      enter_rate_cars_min: '{{ states(''sensor.msb_enter_rate_cars_min'') | float(0) }}'
      exit_rate_cars_min: '{{ states(''sensor.msb_exit_rate_cars_min'') | float(0) }}'
      flow_delta_cars_min: '{{ states(''sensor.msb_flow_delta_cars_min'') | float(0) }}'
      traffic_pressure: '{{ states(''sensor.msb_traffic_pressure'') }}'
      advice: "{% set open = is_state('binary_sensor.msb_show_open','on') %} {% set status = states('sensor.msb_traffic_status')\
        \ %} {% if not open %}\n  The show is currently closed; real-time traffic information is not available.\n\
        {% elif status == 'light' %}\n  Traffic is light; expect a quick drive through the park.\n{% elif status\
        \ == 'moderate' %}\n  Traffic is moderate; expect steady movement with some slower spots.\n{% elif status\
        \ == 'busy' %}\n  Traffic is busy; expect a slower drive and extra time in the park.\n{% elif status ==\
        \ 'very_busy' %}\n  Traffic is very busy; expect a long, slow drive.\n{% else %}\n  Real-time status unavailable.\n\
        {% endif %}\n"
      last_updated: '{{ now().isoformat() }}'
  - name: MSB Traffic Status JSON
    unique_id: msb_traffic_status_json
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:code-json
    state: ok
    attributes:
      payload: "{{ {\n  \"status\": states(\"sensor.msb_traffic_status\"),\n  \"show_open\": is_state(\"binary_sensor.msb_show_open\"\
        ,\"on\"),\n  \"analytics_active\": is_state(\"binary_sensor.msb_gatecounter_analytics_active\",\"on\"),\n\
        \  \"estimated_travel_minutes\": (states(\"sensor.msb_travel_time_estimate_min\") | int(0)),\n  \"in_park_cars\"\
        : (states(\"sensor.msb_in_park_cars_canonical\") | int(none)),\n  \"traffic_pressure\": states(\"sensor.msb_traffic_pressure\"\
        ),\n  \"advice\": (state_attr(\"sensor.msb_traffic_status_snapshot\",\"advice\") | default(\"\") | string\
        \ | replace(\"\\n\",\" \") | replace(\"\\r\",\" \")),\n  \"last_updated\": now().isoformat()\n} | tojson\
        \ }}"
  - name: MSB Lane 2 Advisory
    unique_id: msb_lane_2_advisory
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:road-variant
    state: "{% set open   = is_state('binary_sensor.msb_show_open','on') %} {% set active = is_state('binary_sensor.msb_gatecounter_analytics_active','on')\
      \ %} {% if not open or not active %}\n  closed\n{% else %}\n  {% set inpark = states('sensor.msb_in_park_cars_canonical')\
      \ | int(0) %}\n  {% set enter  = states('sensor.msb_enter_rate_cars_min') | float(0) %}\n  {% set tbc_ms =\
      \ states('sensor.msb_car_counter_time_between_cars_ms') | int(0) %}\n  {% set tbc_s  = (tbc_ms / 1000) if\
      \ tbc_ms > 0 else 9999 %}\n  {% set flow5  = states('sensor.msb_flow_smoothed') | float(0) %}\n  {% set prev\
      \   = this.state | default('Lane 2 OK to Open') %}\n\n  {# --- HARD SAFETY: too full => CLOSE (RED) --- #}\n\
      \  {% if inpark >= 150 %}\n    Close Lane 2\n\n  {# --- OPEN NOW (GREEN): strong demand + sustained building\
      \ + room in park --- #}\n  {% elif (tbc_s <= 20) and (flow5 >= 0.2) and (inpark <= 120) %}\n    Open Lane\
      \ 2\n\n  {# --- OK TO OPEN (YELLOW): moderate demand, still room (optional staffing) --- #}\n  {% elif (tbc_s\
      \ <= 35) and (inpark <= 135) %}\n    Lane 2 OK to Open\n\n  {# --- HYSTERESIS / HOLDING BEHAVIOR --- #}\n\
      \  {% else %}\n    {# If we were already OPEN, don’t drop immediately unless demand really fell #}\n    {%\
      \ if prev == 'Open Lane 2' and (tbc_s <= 28) and (flow5 >= 0.0) and (inpark <= 130) %}\n      Open Lane 2\n\
      \n    {# If we were CLOSE, don’t release close until clearly relieved #}\n    {% elif prev == 'Close Lane\
      \ 2' and inpark >= 140 %}\n      Close Lane 2\n\n    {# Default steady recommendation #}\n    {% else %}\n\
      \      Lane 2 OK to Open\n    {% endif %}\n  {% endif %}\n{% endif %}\n"
    attributes:
      in_park_cars: '{{ states(''sensor.msb_in_park_cars_canonical'') | int(none) }}'
      enter_rate_cars_min: '{{ states(''sensor.msb_enter_rate_cars_min'') | float(0) }}'
      tbc_seconds: '{% set tbc_ms = states(''sensor.msb_car_counter_time_between_cars_ms'') | int(0) %} {{ (tbc_ms
        / 1000) | round(1) if tbc_ms > 0 else 9999 }}

        '
      flow_smoothed_5m: '{{ states(''sensor.msb_flow_smoothed'') | float(0) }}'
      show_open: '{{ is_state(''binary_sensor.msb_show_open'',''on'') }}'
      gatecounter_active: '{{ is_state(''binary_sensor.msb_gatecounter_analytics_active'',''on'') }}'
      prev_state: '{{ this.state }}'
  - name: MSB Merger Director Advisory
    unique_id: msb_merger_director_advisory
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    icon: mdi:account-hard-hat
    state: "{% set open   = is_state('binary_sensor.msb_show_open','on') %} {% set active = is_state('binary_sensor.msb_gatecounter_analytics_active','on')\
      \ %}\n{% if not open or not active %}\n  closed\n{% else %}\n  {% set inpark = states('sensor.msb_in_park_cars_canonical')\
      \ | int(0) %}\n  {% set flow   = states('sensor.msb_flow_health') %}\n  {% set prev   = this.state | default('Merger\
      \ Director Not Needed') %}\n  {% if prev not in ['Merger Director Not Needed','Add Merger Director'] %}\n\
      \    {% set prev = 'Merger Director Not Needed' %}\n  {% endif %}\n\n  {# ADD triggers (conservative) #}\n\
      \  {% if prev == 'Merger Director Not Needed' %}\n    {% if inpark >= 120 or flow in ['building_fast','overloaded']\
      \ %}\n      Add Merger Director\n    {% else %}\n      Merger Director Not Needed\n    {% endif %}\n\n  {#\
      \ REMOVE triggers (hysteresis) #}\n  {% else %}\n    {% if inpark <= 100 and flow in ['draining','balanced','watch']\
      \ %}\n      Merger Director Not Needed\n    {% else %}\n      Add Merger Director\n    {% endif %}\n  {% endif\
      \ %}\n{% endif %}\n"
    attributes:
      in_park_cars: '{{ states(''sensor.msb_in_park_cars_canonical'') | int(none) }}'
      flow_health: '{{ states(''sensor.msb_flow_health'') }}'
      show_open: '{{ is_state(''binary_sensor.msb_show_open'',''on'') }}'
      gatecounter_active: '{{ is_state(''binary_sensor.msb_gatecounter_analytics_active'',''on'') }}'
  - name: MSB Lane 2 Compliance
    unique_id: msb_lane_2_compliance
    availability: "{{ is_state('binary_sensor.msb_show_open', 'off') or is_number(states('sensor.msb_in_park_cars_canonical')) }}"
    state: "{% set advised = states('sensor.msb_lane_2_advisory') %} {% set open = is_state('input_boolean.lane_2_open','on')\
      \ %}\n{% if advised == 'Open Lane 2' and not open %}\n  Action Needed\n{% elif advised == 'Close Lane 2' and\
      \ open %}\n  Action Needed\n{% else %}\n  OK\n{% endif %}\n"
- sensor:
  - name: MSB Effective Entry Closing Time
    unique_id: msb_effective_entry_closing_time
    default_entity_id: sensor.msb_effective_entry_closing_time
    device_class: timestamp
    availability: '{{ has_value(''input_datetime.msb_show_start_time'') and has_value(''input_datetime.msb_show_end_time'')
      }}'
    state: "{% set start_text = states('input_datetime.msb_show_start_time') %}\n{% set end_text = states('input_datetime.msb_show_end_time')\
      \ %}\n{% set valid = start_text not in ['unknown','unavailable',''] and end_text not in ['unknown','unavailable','']\
      \ %}\n{% set ns = namespace(start=now(), end=now()) %}\n{% if valid %}\n {% set ns.start = today_at(start_text)\
      \ %}{% set ns.end = today_at(end_text) %}\n {% if ns.end <= ns.start %}{% set ns.end = ns.end + timedelta(days=1)\
      \ %}{% endif %}\n {% set prev_start = ns.start - timedelta(days=1) %}{% set prev_end = ns.end - timedelta(days=1)\
      \ %}\n {% set ext = states('input_number.show_end_extension_min') | int(0) %}\n {% set ext_day = states('input_text.msb_traffic_extension_date')\
      \ %}\n {% if ext_day == prev_start.strftime('%Y%m%d') %}{% set prev_end = prev_end + timedelta(minutes=ext)\
      \ %}{% endif %}\n {% set tail = states('input_number.msb_carcounter_analytics_cushion_minutes') | int(15)\
      \ %}\n {% if prev_start <= now() < prev_end + timedelta(minutes=tail) %}\n  {% set ns.start = prev_start %}{%\
      \ set ns.end = prev_end %}\n {% elif ext_day == ns.start.strftime('%Y%m%d') %}{% set ns.end = ns.end + timedelta(minutes=ext)\
      \ %}{% endif %}\n{% endif %}\n{{ ns.end.isoformat() if valid else none }}"
    attributes:
      public_start: "{% set start_text = states('input_datetime.msb_show_start_time') %}\n{% set end_text = states('input_datetime.msb_show_end_time')\
        \ %}\n{% set valid = start_text not in ['unknown','unavailable',''] and end_text not in ['unknown','unavailable','']\
        \ %}\n{% set ns = namespace(start=now(), end=now()) %}\n{% if valid %}\n {% set ns.start = today_at(start_text)\
        \ %}{% set ns.end = today_at(end_text) %}\n {% if ns.end <= ns.start %}{% set ns.end = ns.end + timedelta(days=1)\
        \ %}{% endif %}\n {% set prev_start = ns.start - timedelta(days=1) %}{% set prev_end = ns.end - timedelta(days=1)\
        \ %}\n {% set ext = states('input_number.show_end_extension_min') | int(0) %}\n {% set ext_day = states('input_text.msb_traffic_extension_date')\
        \ %}\n {% if ext_day == prev_start.strftime('%Y%m%d') %}{% set prev_end = prev_end + timedelta(minutes=ext)\
        \ %}{% endif %}\n {% set tail = states('input_number.msb_carcounter_analytics_cushion_minutes') | int(15)\
        \ %}\n {% if prev_start <= now() < prev_end + timedelta(minutes=tail) %}\n  {% set ns.start = prev_start\
        \ %}{% set ns.end = prev_end %}\n {% elif ext_day == ns.start.strftime('%Y%m%d') %}{% set ns.end = ns.end\
        \ + timedelta(minutes=ext) %}{% endif %}\n{% endif %}\n{{ ns.start.isoformat() if valid else none }}"
