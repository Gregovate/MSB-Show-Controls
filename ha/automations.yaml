    - input_number.gatecounter_show_end_offset_min
    - input_number.gate_stuck_timeout_s
    - input_number.exit_cardetectms
    - input_text.msb_traffic_extension_date
  - trigger: mqtt
    topic: msb/traffic/GateCounter/System/hello
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: template
    value_template: '{{ has_value(''input_datetime.msb_show_start_date'') and has_value(''input_datetime.msb_show_start_time'')
      and has_value(''input_datetime.msb_show_end_time'') and has_value(''input_datetime.msb_show_end_date'')
      and has_value(''input_datetime.msb_show_down_date'') and has_value(''input_number.show_end_extension_min'')
      and has_value(''input_number.gatecounter_start_offset_min'') and has_value(''input_number.gatecounter_show_end_offset_min'')
      and has_value(''input_number.gate_stuck_timeout_s'') and has_value(''input_number.exit_cardetectms'')
      and is_number(states(''input_number.gatecounter_start_offset_min'')) and is_number(states(''input_number.gatecounter_show_end_offset_min''))
      and is_number(states(''input_number.gate_stuck_timeout_s'')) and is_number(states(''input_number.exit_cardetectms''))
      and is_number(states(''input_number.show_end_extension_min'')) and states(''input_datetime.msb_show_start_date'')[:4]
      == now().strftime(''%Y'') and states(''input_datetime.msb_show_end_date'')[:4]
