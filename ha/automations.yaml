- id: '1732920668021'
  alias: 2 Minute Warning Alarm
  description: Turn alarms on at 4:58pm and off at 5:00pm.
  triggers:
  - at: '16:58:00'
    id: warn_on
    trigger: time
  - at: '17:00:00'
    id: warn_off
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: warn_on
      sequence:
      - target:
          entity_id:
          - switch.switch_gate_alarm
          - switch.enter_alarm_light
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: warn_off
      sequence:
      - target:
