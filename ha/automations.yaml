- id: '1732156933135'
  alias: Update Weather Forecast
  description: ''
  triggers:
  - trigger: time_pattern
    hours: '1'
  conditions: []
  actions:
  - action: weather.get_forecasts
    metadata: {}
    data:
      type: daily
    target:
      entity_id: weather.forecast_home
  mode: single
- id: '1732219695497'
  alias: Reset Enter Daily Total
  description: Update Car Counter Daily Total (manual override)
  triggers:
  - trigger: state
    entity_id: input_number.update_enter_daily_total
  conditions:
  - condition: state
    entity_id: input_boolean.allow_enter_resets
    state: 'on'
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state)
      }}'
  actions:
  - action: mqtt.publish
    data:
      topic: msb/traffic/CarCounter/Config/countCorrection
      payload: '{{ now().strftime(''%Y%m%d%H%M%S'') }},daily,{{ states(''input_number.update_enter_daily_total'')
        | int }}'
      qos: 0
      retain: false
  mode: single
- id: '1732222198432'
  alias: Reset Enter Show Total
  description: Update Car Counter Show Total (manual override)
  triggers:
  - trigger: state
    entity_id: input_number.update_enter_show_total
  conditions:
  - condition: state
    entity_id: input_boolean.enable_calendar_resets
    state: 'on'
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state)
      }}'
  actions:
  - action: mqtt.publish
    data:
      topic: msb/traffic/CarCounter/Config/countCorrection
      payload: '{{ now().strftime(''%Y%m%d%H%M%S'') }},show,{{ states(''input_number.update_enter_show_total'')
        | int }}'
      qos: 0
      retain: false
  mode: single
- id: msb_reset_days_running
  alias: Reset Days Running
  description: Apply a manual correction to the number of days the show actually opened.
  triggers:
  - trigger: state
    entity_id: input_number.update_days_running
  conditions:
  - condition: state
    entity_id: input_boolean.enable_calendar_resets
    state: 'on'
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and is_number(trigger.from_state.state) and is_number(trigger.to_state.state)
         and trigger.from_state.state | float != trigger.to_state.state | float
         and trigger.to_state.state | float == trigger.to_state.state | int
         and 0 <= trigger.to_state.state | int <= 366 }}
  actions:
  - action: mqtt.publish
    data:
      topic: msb/traffic/CarCounter/Config/resetDaysRunning
      payload: '{{ trigger.to_state.state | int }}'
      qos: 0
      retain: false
  mode: queued
- id: '1732379608932'
  alias: Car Counter Beam Alarm
  description: Drive entrance alarm beacon from Car Counter alarm state.
  triggers:
  - entity_id: binary_sensor.msb_car_counter_binary_alarm_v2
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions: '{{ is_state(''binary_sensor.msb_car_counter_binary_alarm_v2'',
        ''on'') }}'
      sequence:
      - target:
          entity_id:
          - switch.enter_alarm_light
        action: switch.turn_on
      - data:
          title: Car Counter Stuck!
          message: 'CarCounter reports {{ states(''sensor.msb_car_counter_alarm'')
            }}. The enter beam is stuck HIGH beyond timeout. Check the counter.

            '
        action: persistent_notification.create
      - data:
          message: 'Car Counter Alarm: beam stuck at the counter. Check sensors now.'
        action: notify.mobile_app_dave_s_iphone
    - conditions: '{{ is_state(''binary_sensor.msb_car_counter_binary_alarm_v2'',
        ''off'') }}'
      sequence:
      - target:
          entity_id:
          - switch.enter_alarm_light
        action: switch.turn_off
      - data:
          message: Car Counter Alarm cleared.
        action: notify.mobile_app_dave_s_iphone
  mode: restart
