    state: 'on'
  actions:
  - action: mqtt.publish
    data:
      topic: msb/traffic/GateCounter/Config/operatingSettings
      payload: "{% set start = states('input_datetime.msb_show_start_time').split(':')
        %}\n{% set end = states('input_datetime.msb_show_end_time').split(':') %}\n{%
        set ext = states('input_number.show_end_extension_min') | int if states('input_text.msb_traffic_extension_date')
        == now().strftime('%Y%m%d') else 0 %}\n{{ [1, start[0]|int*60+start[1]|int,
        end[0]|int*60+end[1]|int,\n states('input_number.gatecounter_start_offset_min')|int,
        states('input_number.gatecounter_show_end_offset_min')|int, ext,\n now().strftime('%Y%m%d')|int,
        (states('input_number.gate_stuck_timeout_s')|float*1000)|int,\n states('input_number.exit_cardetectms')|int,\n
        states('input_datetime.msb_show_end_date')|replace('-','')|int,\n states('input_datetime.msb_show_down_date')|replace('-','')|int,
        now().year] | join(',') }}"
      qos: 1
      retain: true
  - action: mqtt.publish
    data:
      topic: msb/traffic/GateCounter/Config/showStartDate
      payload: '{{ states(''input_datetime.msb_show_start_date'') }}'
      qos: 1
      retain: true
  mode: restart
- id: msb_traffic_extension_date_v9
  alias: 'MSB Traffic: Date the show extension'
  triggers:
  - trigger: state
    entity_id: input_number.show_end_extension_min
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state)
      }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.msb_traffic_extension_date
    data:
      value: '{{ now().strftime(''%Y%m%d'') }}'
  mode: restart
- id: msb_traffic_extension_clear_v9
  alias: 'MSB Traffic: Clear prior night extension'
  triggers:
  - trigger: time
    at: '00:00:00'
    id: midnight
  - trigger: homeassistant
    event: start
    id: startup
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.id == 'midnight' or
         (has_value('input_text.msb_traffic_extension_date') and
          not is_state('input_text.msb_traffic_extension_date', now().strftime('%Y%m%d'))) }}
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.show_end_extension_min
    data:
      value: 0
  mode: single
- id: msb_traffic_carcounter_storage_warning_v9
  alias: 'MSB Traffic: CarCounter storage warning'
  triggers:
  - trigger: mqtt
    topic: msb/traffic/CarCounter/System/countPersistence
  - trigger: mqtt
    topic: msb/traffic/CarCounter/System/hourlyExport
  - trigger: mqtt
    topic: msb/traffic/CarCounter/System/summaryExport
  - trigger: mqtt
    topic: msb/traffic/CarCounter/System/settingsHealth
  - trigger: mqtt
    topic: msb/traffic/CarCounter/System/sd/health
  conditions:
  - condition: template
    value_template: '{{ trigger.payload not in [''OK'',''OK_RESTORED'',''NOT_DUE'',''NOT_ATTEMPTED'']
      }}'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: msb_traffic_carcounter_storage
      title: CarCounter recording/configuration warning
      message: '{{ trigger.topic }}: {{ trigger.payload }}. Check device diagnostics
        before relying on recorded totals.'
  mode: queued
  max: 10
- id: msb_traffic_gatecounter_storage_warning_v9
  alias: 'MSB Traffic: GateCounter storage warning'
  triggers:
  - trigger: mqtt
    topic: msb/traffic/GateCounter/System/countPersistence
  - trigger: mqtt
    topic: msb/traffic/GateCounter/System/hourlyExport
  - trigger: mqtt
    topic: msb/traffic/GateCounter/System/summaryExport
  - trigger: mqtt
    topic: msb/traffic/GateCounter/System/settingsHealth
  - trigger: mqtt
    topic: msb/traffic/GateCounter/System/sd/health
  conditions:
  - condition: template
    value_template: '{{ trigger.payload not in [''OK'',''OK_RESTORED'',''NOT_DUE'',''NOT_ATTEMPTED'']
      }}'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: msb_traffic_gatecounter_storage
      title: GateCounter recording/configuration warning
      message: '{{ trigger.topic }}: {{ trigger.payload }}. Check device diagnostics
        before relying on recorded totals.'
  mode: queued
  max: 10
- id: '1795560346940'
  alias: Production - Car Counter Arches Follow Radio
  description: Follows radio state changes while allowing independent arch testing.
  triggers:
  - trigger: state
    entity_id: switch.broadcast_radio_switch
    to: 'on'
    id: radio_on
  - trigger: state
    entity_id: switch.broadcast_radio_switch
    to: 'off'
    id: radio_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: radio_on
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.car_counter_arches
    - conditions:
      - condition: trigger
        id: radio_off
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.car_counter_arches
  mode: restart
- id: '1795561080340'
  alias: Production - Radio Charger Schedule
  description: Charges the Command Center and VT radios overnight and powers both
    stations for the afternoon check.
  triggers:
  - trigger: time
    at: '20:45:00'
    id: overnight_on
  - trigger: time
    at: 01:00:00
    id: overnight_off
  - trigger: time
    at: '16:15:00'
    id: afternoon_on
  - trigger: time
    at: '16:30:00'
    id: afternoon_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - overnight_on
        - afternoon_on
      - condition: state
        entity_id: binary_sensor.msb_show_season
        state: 'on'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.command_center_radio_charger
          - switch.vt_radio_chargers
    - conditions:
      - condition: trigger
        id:
        - overnight_off
        - afternoon_off
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.command_center_radio_charger
          - switch.vt_radio_chargers
  mode: restart
- id: msb_traffic_log_gate_open
  alias: Traffic - Log gate opening
  description: Record each observed gate opening, including outside show hours.
  triggers:
    - trigger: state
      entity_id: cover.traffic_ghost_controls_ghost_controls
      # A reconnect while already open is not evidence of a new opening.
      from:
        - closed
        - opening
        - closing
      to: open
  actions:
    - action: logbook.log
      data:
        name: MSB Traffic
        message: Gate opened
        entity_id: cover.traffic_ghost_controls_ghost_controls
  mode: queued
