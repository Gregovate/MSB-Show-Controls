- id: '1763557995826'
  alias: 'MSB Gate: Sort traffic into show/normal buckets'
  triggers:
  - entity_id: sensor.enter_cars
    trigger: state
  actions:
  - variables:
      old: '{% set s = trigger.from_state.state if trigger.from_state else ''0'' %}
        {{ s | float(0) }}

        '
      new: '{% set s = trigger.to_state.state if trigger.to_state else ''0'' %} {{
        s | float(0) }}

        '
      delta: '{% set d = new - old %} {{ d if d > 0 else 0 }}

        '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ delta > 0 }}'
      - condition: state
        entity_id: binary_sensor.msb_show_open
        state: 'on'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.msb_show_traffic_current
        data:
          value: '{{ states(''input_number.msb_show_traffic_current'') | float(0)
            + delta }}

            '
    - conditions:
      - condition: template
        value_template: '{{ delta > 0 }}'
      - condition: state
        entity_id: binary_sensor.msb_show_open
        state: 'off'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.normal_traffic_current
        data:
          value: '{{ states(''input_number.normal_traffic_current'') | float(0) +
            delta }}

            '
  mode: queued
  max: 20
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state)
      }}'
- id: '1763561348256'
  alias: 'MSB Gate: Rollover show-season traffic'
  description: Move season totals on Jan 1; zero current season.
  triggers:
  - trigger: time
    at: 00:05:00
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ now().month == 1 and now().day == 1 }}'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.msb_show_traffic_two_seasons_ago
    data:
      value: '{{ states(''input_number.msb_show_traffic_last_season'') | float(0)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.msb_show_traffic_last_season
    data:
      value: '{{ states(''input_number.msb_show_traffic_current'') | float(0) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.msb_show_traffic_current
    data:
      value: 0
  mode: single
- id: production_laser_projector_schedule
  alias: Production - Projector Schedule
  description: Runs the projector on its dashboard schedule and turns it off on Show
    Stop.
  triggers:
  - trigger: time
    at: input_datetime.production_projector_on
    id: projector_on
  - trigger: template
    value_template: >-
      {% set base = states('input_datetime.production_projector_off') %}
      {% set minutes = states('input_number.show_end_extension_min') | int(0)
         if is_state('input_text.msb_traffic_extension_date', now().strftime('%Y%m%d')) else 0 %}
      {{ base not in ['unknown','unavailable',''] and now() >= today_at(base) + timedelta(minutes=minutes) }}
    id: projector_off
  - trigger: state
    entity_id: input_boolean.msb_show_force_close
    to: 'on'
    id: show_stop
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: projector_on
      - condition: state
        entity_id: binary_sensor.msb_show_season
        state: 'on'
      - condition: state
        entity_id: input_boolean.msb_show_force_close
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.projector_switch
    - conditions:
      - condition: trigger
        id:
        - projector_off
        - show_stop
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.projector_switch
  mode: restart
- id: production_broadcast_radio_schedule
  alias: Production - Broadcast Radio Schedule
  description: Controls the broadcast radio and volunteer marquee and turns both off
    when Show Stop is activated.
  triggers:
  - trigger: time
    at: input_datetime.production_radio_on
    id: radio_on
  - trigger: template
    value_template: >-
      {% set base = states('input_datetime.production_radio_off') %}
      {% set minutes = states('input_number.show_end_extension_min') | int(0)
         if is_state('input_text.msb_traffic_extension_date', now().strftime('%Y%m%d')) else 0 %}
      {{ base not in ['unknown','unavailable',''] and now() >= today_at(base) + timedelta(minutes=minutes) }}
    id: radio_off
  - trigger: state
    entity_id: input_boolean.msb_show_force_close
    to: 'on'
    id: show_stop
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: radio_on
      - condition: state
        entity_id: binary_sensor.msb_show_season
        state: 'on'
      - condition: state
        entity_id: input_boolean.msb_show_force_close
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.broadcast_radio_switch
          - switch.volunteer_marquee
          - switch.car_counter_arches
    - conditions:
      - condition: trigger
        id:
        - radio_off
        - show_stop
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.broadcast_radio_switch
          - switch.volunteer_marquee
          - switch.car_counter_arches
  mode: restart
- id: production_laser_projector_safety_off
  alias: Production - Projector Safety Off
  description: Turns the projector off at the safety cutoff.
  triggers:
  - trigger: template
    value_template: >-
      {% set base = states('input_datetime.production_projector_off_safety') %}
      {% set minutes = states('input_number.show_end_extension_min') | int(0)
         if is_state('input_text.msb_traffic_extension_date', now().strftime('%Y%m%d')) else 0 %}
      {{ base not in ['unknown','unavailable',''] and now() >= today_at(base) + timedelta(minutes=minutes) }}
  conditions:
  - condition: state
    entity_id: switch.projector_switch
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.projector_switch
  mode: single
- id: msb_traffic_carcounter_settings_v9
  alias: 'MSB Traffic: Apply CarCounter settings'
  description: HA owns schedule/reset offsets and tuning. Complete validated transaction;
    never resets counts. Firmware .9 required.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - input_datetime.msb_show_start_date
    - input_datetime.msb_show_start_time
    - input_datetime.msb_show_end_time
    - input_datetime.msb_show_end_date
    - input_datetime.msb_show_down_date
    - input_number.show_end_extension_min
    - input_number.carcounter_start_offset_min
    - input_number.carcounter_end_offset_min
    - input_number.enter_stuck_timeout_s
    - input_number.enter_cardetectms
    - input_text.msb_traffic_extension_date
  - trigger: mqtt
    topic: msb/traffic/CarCounter/System/hello
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: template
    value_template: '{{ has_value(''input_datetime.msb_show_start_date'') and has_value(''input_datetime.msb_show_start_time'')
      and has_value(''input_datetime.msb_show_end_time'') and has_value(''input_datetime.msb_show_end_date'')
      and has_value(''input_datetime.msb_show_down_date'') and has_value(''input_number.show_end_extension_min'')
      and has_value(''input_number.carcounter_start_offset_min'') and has_value(''input_number.carcounter_end_offset_min'')
      and has_value(''input_number.enter_stuck_timeout_s'') and has_value(''input_number.enter_cardetectms'')
      and is_number(states(''input_number.carcounter_start_offset_min'')) and is_number(states(''input_number.carcounter_end_offset_min''))
      and is_number(states(''input_number.enter_stuck_timeout_s'')) and is_number(states(''input_number.enter_cardetectms''))
      and is_number(states(''input_number.show_end_extension_min'')) and states(''input_datetime.msb_show_start_date'')[:4]
      == now().strftime(''%Y'') and states(''input_datetime.msb_show_end_date'')[:4]
      == now().strftime(''%Y'') and states(''input_datetime.msb_show_down_date'')[:4]
      == now().strftime(''%Y'') }}'
  actions:
  - action: mqtt.publish
    data:
      topic: msb/traffic/CarCounter/Config/operatingSettings
      payload: "{% set start = states('input_datetime.msb_show_start_time').split(':')
        %}\n{% set end = states('input_datetime.msb_show_end_time').split(':') %}\n{%
        set ext = states('input_number.show_end_extension_min') | int if states('input_text.msb_traffic_extension_date')
        == now().strftime('%Y%m%d') else 0 %}\n{{ [1, start[0]|int*60+start[1]|int,
        end[0]|int*60+end[1]|int,\n states('input_number.carcounter_start_offset_min')|int,
        states('input_number.carcounter_end_offset_min')|int, ext,\n now().strftime('%Y%m%d')|int,
        (states('input_number.enter_stuck_timeout_s')|float*1000)|int,\n states('input_number.enter_cardetectms')|int,\n
        states('input_datetime.msb_show_end_date')|replace('-','')|int,\n states('input_datetime.msb_show_down_date')|replace('-','')|int,
        now().year] | join(',') }}"
      qos: 1
      retain: true
  - action: mqtt.publish
    data:
      topic: msb/traffic/CarCounter/Config/showStartDate
      payload: '{{ states(''input_datetime.msb_show_start_date'') }}'
      qos: 1
      retain: true
  mode: restart
- id: msb_traffic_gatecounter_settings_v9
  alias: 'MSB Traffic: Apply GateCounter settings'
  description: HA owns schedule/reset offsets and tuning. Complete validated transaction;
    never resets counts. Firmware .9 required.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - input_datetime.msb_show_start_date
    - input_datetime.msb_show_start_time
    - input_datetime.msb_show_end_time
    - input_datetime.msb_show_end_date
    - input_datetime.msb_show_down_date
    - input_number.show_end_extension_min
